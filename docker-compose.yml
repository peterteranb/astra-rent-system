# Dos servicios: db (PostgreSQL 17) y web (Django con gunicorn). Los datos viven en el volumen pgdata.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-astra_rent}
      POSTGRES_USER: ${DB_USER:-astra}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      # Dentro de Docker la base se llama por el nombre de su servicio.
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      # WEB_PORT cambia el puerto de la máquina si Windows tiene reservado el 8000.
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs

volumes:
  pgdata:
