name: Sesion 12 - contrato del flujo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-flujo:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Agregado: PostgreSQL temporal para las pruebas (el proyecto usa Django + PostgreSQL).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: astra_rent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Agregado: las variables que lee config/settings.py (en GitHub no hay .env).
    env:
      DB_NAME: astra_rent
      DB_USER: astra
      DB_PASSWORD: ci-password
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - name: Obtener la version del repositorio
        uses: actions/checkout@v4  #se cambio de v6 a v4 para evitar problemas de compatibilidad

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Registrar entorno y version comprobada
        run: |
          python --version
          git rev-parse HEAD

      - name: Instalar dependencias declaradas
        run: python -m pip install -r requirements-ci.txt

      # Para paquetes src/ con pyproject.toml, agregar aqui su instalacion:
      # - run: python -m pip install -e .

      - name: Correr todas las pruebas del proyecto con Pytest
        run: python -m pytest -q --junitxml=evidencias/junit.xml

      - name: Conservar el resultado de las pruebas
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidencias/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Preparar candidato de codigo fuente aprobado
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: git archive --format=zip --output="entrega-${GITHUB_SHA}.zip" HEAD

      - name: Conservar candidato para revision
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: candidato-sesion12-${{ github.sha }}
          path: entrega-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14