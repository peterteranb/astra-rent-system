{% extends "base.html" %}

{% block title %}Cambiar contraseña{% endblock %}
{% block heading %}Cambiar contraseña{% endblock %}

{% block content %}
  <section class="card login">
    <form class="form" method="post" action="{% url 'password_change' %}">
      {% csrf_token %}
      {% include "accounts/password_form_fields.html" %}
      <div class="form__actions">
        <button class="button" type="submit">Cambiar contraseña</button>
        <a class="button button--secondary" href="{% url 'my_account' %}">Volver a Mi cuenta</a>
      </div>
    </form>
  </section>
{% endblock %}
