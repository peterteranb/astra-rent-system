{# Los campos de un formulario de contraseña de Django, con su ayuda y sus errores. #}
{% include "includes/form_errors.html" %}
{% for field in form %}
  <div class="form__field">
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text %}<small class="form__help">{{ field.help_text|safe }}</small>{% endif %}
    {{ field.errors }}
  </div>
{% endfor %}
